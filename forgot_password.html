<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>กู้คืนรหัสผ่าน - Blox Fruits Plush</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-box {
            max-width: 420px;
            margin: 60px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.08);
            border: 1px solid #e2dcd2;
        }
        .auth-title {
            text-align: center;
            font-size: 22px;
            color: #80001d;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .error-msg {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/shop" class="logo">Blox Fruits Plush</a>
        <div class="nav-links">
            <a href="/login" class="nav-btn nav-btn-outline"><i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i> กลับหน้าล็อกอิน</a>
        </div>
    </div>

    <div class="container">
        <div class="auth-box">
            <h2 class="auth-title"><i class="fa-solid fa-key"></i> ตั้งรหัสผ่านใหม่</h2>
            
            {{ error_block }}

            <p style="font-size: 13px; color: #64748b; margin-bottom: 18px; text-align: center;">
                กรอกชื่อผู้ใช้งาน และอีเมล Gmail ให้ตรงกับบัญชีในระบบเพื่อตั้งรหัสผ่านใหม่
            </p>

            <form method="POST" action="/forgot-password">
                <div class="form-group">
                    <label>ชื่อผู้ใช้งาน (Username):</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>อีเมล (Gmail):</label>
                    <input type="email" name="email" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>รหัสผ่านใหม่ (6-20 ตัวอักษร พิมพ์ใหญ่, เล็ก, ตัวเลข):</label>
                    <input type="password" name="new_password" required>
                </div>
                <button type="submit" class="btn-cyan" style="width: 100%; margin-top: 10px;">บันทึกรหัสผ่านใหม่</button>
            </form>
        </div>
    </div>

</body>
</html>
