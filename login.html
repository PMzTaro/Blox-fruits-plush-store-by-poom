<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>เข้าสู่ระบบ - Blox Fruits Plush</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .auth-box {
            max-width: 400px;
            margin: 80px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(220, 20, 60, 0.08);
            border: 1px solid #e2dcd2;
        }
        .auth-title {
            text-align: center;
            font-size: 24px;
            color: #80001d;
            font-weight: 700;
            margin-bottom: 25px;
        }
        .error-msg {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
            border: 1px solid #fca5a5;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/shop" class="logo">Blox Fruits Plush</a>
        <div class="nav-links">
            <a href="/register" class="nav-btn nav-btn-outline">สมัครสมาชิก</a>
        </div>
    </div>

    <div class="container">
        <div class="auth-box">
            <h2 class="auth-title">เข้าสู่ระบบ</h2>
            
            {{ error_block }}

            <form method="POST" action="/login">
                <div class="form-group">
                    <label>ชื่อผู้ใช้งาน (Username):</label>
                    <input type="text" name="username" required>
                </div>
                <div class="form-group">
                    <label>รหัสผ่าน (Password):</label>
                    <input type="password" name="password" required>
                </div>
                
                <div style="text-align: right; margin-bottom: 15px;">
                    <a href="/forgot-password" style="font-size: 12px; color: #dc143c; text-decoration: none; font-weight: 600;">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="btn-cyan" style="width: 100%;">เข้าสู่ระบบ</button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 13px; color: #64748b;">
                ยังไม่มีบัญชีผู้ใช้? <a href="/register" style="color: #dc143c; text-decoration: none; font-weight: 600;">สมัครสมาชิกที่นี่</a>
            </div>
        </div>
    </div>

</body>
</html>
