<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบุที่อยู่จัดส่ง - Blox Fruits Plush</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .step-bar {
            display: flex;
            justify-content: space-around;
            border-bottom: 2px solid #e2dcd2;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
        .step-item {
            font-size: 15px;
            font-weight: 700;
            color: #94a3b8;
        }
        .step-item.active {
            color: #dc143c;
            border-bottom: 3px solid #dc143c;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="/shop" class="logo">Blox Fruits Plush</a>
    </div>

    <div class="container" style="max-width: 750px;">
        <div style="background: white; padding: 35px; border-radius: 20px; border: 1px solid #e2dcd2; box-shadow: 0 10px 30px rgba(220, 20, 60, 0.08);">
            
            <div class="step-bar">
                <div class="step-item active">1. ตรวจสอบที่อยู่จัดส่ง</div>
                <div class="step-item">2. ชำระเงิน & แนบสลีป</div>
            </div>

            <h3 style="font-size: 18px; color: #80001d; margin-bottom: 15px; font-weight:700;">สรุปรายการสั่งซื้อ</h3>

            <div style="background: #f2efe7; padding: 18px; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e2dcd2;">
                <table style="margin-top:0; background:white;">
                    {{ order_summary_rows }}
                </table>
                <div style="display:flex; justify-content:space-between; margin-top:12px; font-size:13px; color:#64748b;">
                    <span>รวมราคาค่าสินค้า:</span>
                    <span>{{ subtotal_price }}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:4px; font-size:13px; color:#64748b;">
                    <span>ภาษีมูลค่าเพิ่ม (VAT 7%):</span>
                    <span>{{ vat_price }}</span>
                </div>
                <div style="display:flex; justify-content:space-between; margin-top:10px; font-weight:700; color:#dc143c; font-size:18px; border-top:1px solid #e2dcd2; padding-top:8px;">
                    <span>ยอดชำระสุทธิทั้งสิ้น:</span>
                    <span>{{ total_price }}</span>
                </div>
            </div>

            <h3 style="font-size: 18px; color: #80001d; margin-bottom: 15px; font-weight:700;">กรอกที่อยู่จัดส่ง & เบอร์โทรศัพท์</h3>

            <form method="POST" action="/checkout/save-address">
                <div class="form-group">
                    <label style="font-size:13px;">เบอร์โทรศัพท์ติดต่อสำหรับจัดส่ง:</label>
                    <input type="text" name="phone" value="{{ phone }}" placeholder="08XXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label style="font-size:13px;">ที่อยู่จัดส่งสินค้าโดยรายละเอียด:</label>
                    <textarea name="address" rows="3" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; outline: none; font-family:'Prompt';" placeholder="กรอกที่อยู่จัดส่งสินค้า..." required>{{ address }}</textarea>
                </div>

                <button type="submit" class="btn-cyan" style="padding: 14px; width:100%; margin-top:10px; font-size:15px;">
                    ดำเนินการต่อ (ชำระเงิน) &rarr;
                </button>
            </form>
        </div>
    </div>

</body>
</html>
